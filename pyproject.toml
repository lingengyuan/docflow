[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow"
version = "0.58.0"
description = "Local-first personal document Q&A and knowledge workspace."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.scripts]
docflow = "main:cli"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.setuptools.data-files]
"share/docflow" = [
  "config.example.yaml",
  "README.md",
  "README.zh-CN.md",
  "LICENSE",
]
"share/docflow/frontend" = [
  "frontend/app.css",
  "frontend/favicon.svg",
  "frontend/index.html",
  "frontend/manifest.webmanifest",
  "frontend/styles.css",
  "frontend/sw.js",
]
"share/docflow/frontend/js" = [
  "frontend/js/app-shell.js",
  "frontend/js/bootstrap.js",
  "frontend/js/chat-actions.js",
  "frontend/js/chat-evidence.js",
  "frontend/js/chat-stream.js",
  "frontend/js/chat.js",
  "frontend/js/history.js",
  "frontend/js/i18n.js",
  "frontend/js/icons.js",
  "frontend/js/library-actions.js",
  "frontend/js/library-knowledge.js",
  "frontend/js/library-render.js",
  "frontend/js/library.js",
  "frontend/js/notes-review.js",
  "frontend/js/notes.js",
  "frontend/js/pwa.js",
  "frontend/js/queue-upload.js",
  "frontend/js/settings-bootstrap.js",
  "frontend/js/settings-data.js",
  "frontend/js/settings-models.js",
  "frontend/js/settings.js",
  "frontend/js/shared-ui.js",
  "frontend/js/source-preview-actions.js",
  "frontend/js/source-preview.js",
  "frontend/js/state.js",
  "frontend/js/theme.js",
]
"share/docflow/frontend/js/generated" = [
  "frontend/js/generated/stream-parser.js",
]
"share/docflow/frontend/partials" = [
  "frontend/partials/app.html",
]
"share/docflow/docs" = [
  "docs/architecture.md",
  "docs/cli.md",
  "docs/development.md",
  "docs/evaluation.md",
  "docs/features.md",
  "docs/privacy.md",
  "docs/release.md",
  "docs/status.md",
]
"share/docflow/docs/assets" = [
  "docs/assets/chat.png",
  "docs/assets/library.png",
  "docs/assets/notes.png",
  "docs/assets/settings.png",
]
"share/docflow/eval" = [
  "eval/public_retrieval_v1.jsonl",
]
"share/docflow/eval/public_corpus" = [
  "eval/public_corpus/README.md",
  "eval/public_corpus/alice_wonderland_excerpt.txt",
  "eval/public_corpus/common_sense_excerpt.txt",
  "eval/public_corpus/declaration_independence_excerpt.txt",
  "eval/public_corpus/douglass_learning_excerpt.txt",
  "eval/public_corpus/dracula_excerpt.txt",
  "eval/public_corpus/emma_excerpt.txt",
  "eval/public_corpus/federalist_10_excerpt.txt",
  "eval/public_corpus/frankenstein_excerpt.txt",
  "eval/public_corpus/gettysburg_address.txt",
  "eval/public_corpus/jane_eyre_excerpt.txt",
  "eval/public_corpus/lincoln_emancipation_excerpt.txt",
  "eval/public_corpus/lincoln_second_inaugural_excerpt.txt",
  "eval/public_corpus/moby_dick_excerpt.txt",
  "eval/public_corpus/nasa_apollo11_summary.txt",
  "eval/public_corpus/nasa_artemis_summary.txt",
  "eval/public_corpus/nasa_hubble_summary.txt",
  "eval/public_corpus/nasa_iss_summary.txt",
  "eval/public_corpus/nasa_mars_rovers.txt",
  "eval/public_corpus/nasa_moon_facts.txt",
  "eval/public_corpus/nasa_parker_solar_probe.txt",
  "eval/public_corpus/nasa_voyager_summary.txt",
  "eval/public_corpus/nasa_webb_telescope_summary.txt",
  "eval/public_corpus/poe_raven_excerpt.txt",
  "eval/public_corpus/pride_prejudice_excerpt.txt",
  "eval/public_corpus/shakespeare_hamlet_excerpt.txt",
  "eval/public_corpus/shakespeare_macbeth_excerpt.txt",
  "eval/public_corpus/sherlock_bohemia_excerpt.txt",
  "eval/public_corpus/tale_two_cities_excerpt.txt",
  "eval/public_corpus/us_constitution_article1.txt",
  "eval/public_corpus/us_constitution_preamble.txt",
  "eval/public_corpus/us_eighth_amendment.txt",
  "eval/public_corpus/us_fifth_amendment.txt",
  "eval/public_corpus/us_first_amendment.txt",
  "eval/public_corpus/us_fourth_amendment.txt",
  "eval/public_corpus/us_ninth_amendment.txt",
  "eval/public_corpus/us_second_amendment.txt",
  "eval/public_corpus/us_seventh_amendment.txt",
  "eval/public_corpus/us_sixth_amendment.txt",
  "eval/public_corpus/us_tenth_amendment.txt",
  "eval/public_corpus/us_third_amendment.txt",
  "eval/public_corpus/washington_farewell_excerpt.txt",
  "eval/public_corpus/wizard_oz_excerpt.txt",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".venv",
  "node_modules",
  "docs/history",
  "qdrant_storage",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/api/schemas.py", "src/query"]
