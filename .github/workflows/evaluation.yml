name: Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  public-retrieval:
    name: Public retrieval and parsing eval
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      qdrant:
        image: qdrant/qdrant:latest@sha256:b3063c673f3973877c038eeecc392bad5011f072ee7892b56c9a8e204a3bdea9
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-qwen3-embedding-0.6b-v1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Create CI eval config
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("config.example.yaml").read_text(encoding="utf-8")
          text = text.replace('db_path: "data/docflow.db"', 'db_path: "data/ci-eval/docflow.db"')
          text = text.replace('id_counter: "data/qdrant_id_counter.txt"', 'id_counter: "data/ci-eval/qdrant_id_counter.txt"')
          text = text.replace("allow_model_download: false", "allow_model_download: true")
          Path("config.ci-eval.yaml").write_text(text, encoding="utf-8")
          PY
      - name: Parsing eval
        run: python main.py dev eval parsing --config config.ci-eval.yaml --json
      - name: Public retrieval eval
        run: python main.py dev eval public --config config.ci-eval.yaml --no-rerank --write-results --json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # actions/upload-artifact@v5
        if: always()
        with:
          name: docflow-public-eval-results
          path: eval/results/public/*
          if-no-files-found: ignore
