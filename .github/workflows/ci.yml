name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-14
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Compile
        run: python -m py_compile main.py src/maintenance/startup.py src/api/app.py
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy
      - name: Tests
        run: python -m pytest
      - name: Performance smoke
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/run_performance_smoke.py --json
      - name: Faithfulness eval
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python main.py dev eval faithfulness --json
      - name: Large-library smoke
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python main.py dev eval large-library --documents 200 --queries 5 --json
      - name: Parsing eval
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python main.py dev eval parsing --json
      - name: Release surface
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/run_release_surface_check.py
      - name: External benchmark catalog
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/run_external_benchmark_status.py --json
      - name: Dead-code audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/run_dead_code_audit.py --json
      - name: Package smoke
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/package_smoke.py

  offline-doctor:
    name: Offline doctor on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Offline doctor
        run: python main.py doctor --offline --json

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Syntax
        run: npm run check:frontend
      - name: Unit tests
        run: npm run test:frontend
      - name: Build
        run: npm run build:frontend
      - name: Audit
        run: npm run audit:frontend
