name: Dependency Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2"

permissions:
  contents: read

jobs:
  python:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.0
      - name: Audit pinned requirements
        run: |
          python -m pip_audit \
            -r requirements.txt \
            -r requirements-dev.txt \
            -r requirements-vision.txt

  frontend:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm run audit:frontend
