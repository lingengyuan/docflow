name: Python Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and smoke test package artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python scripts/package_smoke.py
          python -m build
      - name: Prepare release candidate metadata
        run: python scripts/build_release_candidate.py --dist-dir dist --skip-build --json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7.0.1
        with:
          name: docflow-python-package
          path: dist/*
